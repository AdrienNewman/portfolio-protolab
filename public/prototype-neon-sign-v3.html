<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype V3 - Néon SVG Professionnel "Site en construction..."</title>

    <style>
        :root {
            --neon-color: #ff0080;
            --neon-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.95) 100%);
        }

        .demo-container {
            position: relative;
            z-index: 10;
        }

        /* ==========================================
           NEON SIGN SVG - POLICE PROFESSIONNELLE
           ========================================== */

        .neon-sign-wrapper {
            animation: neon-float 6s ease-in-out infinite;
            transform: rotate(-3deg);
            filter: drop-shadow(0 0 40px rgba(255, 0, 128, 0.4));
        }

        .neon-svg {
            width: clamp(320px, 60vw, 700px);
            height: auto;
            overflow: visible;
        }

        /* Couche 1 - Super Glow (halo diffus magenta) */
        .super-glow path {
            fill: var(--neon-color);
            stroke: none;
            filter: url(#super-glow-filter);
            opacity: 0.5;
        }

        /* Couche 2 - Glow coloré magenta */
        .glow path {
            fill: var(--neon-color);
            stroke: none;
            filter: url(#glow-filter);
            opacity: 0.9;
        }

        /* Couche 3 - Tube blanc central (texte lumineux) */
        .tube path {
            fill: var(--neon-white);
            stroke: none;
        }

        /* Animations flicker subtiles */
        .flicker-a { animation: flicker-a 4s ease-in-out infinite; }
        .flicker-b { animation: flicker-b 3s ease-in-out infinite 0.5s; }
        .flicker-c { animation: flicker-c 5s ease-in-out infinite 1s; }

        @keyframes flicker-a {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }

        @keyframes flicker-b {
            0%, 30%, 32%, 70%, 72%, 100% { opacity: 1; }
            31%, 71% { opacity: 0.3; }
        }

        @keyframes flicker-c {
            0%, 45%, 47%, 85%, 87%, 100% { opacity: 1; }
            46%, 86% { opacity: 0.35; }
        }

        @keyframes neon-float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(-1deg); }
        }

        /* Contrôles */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .controls button {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #00ffff;
            color: #000;
        }

        .controls button.active {
            background: #ff0080;
            border-color: #ff0080;
            color: #fff;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-family: monospace;
            font-size: 11px;
        }

        @media (prefers-reduced-motion: reduce) {
            .neon-sign-wrapper,
            .flicker-a, .flicker-b, .flicker-c {
                animation: none !important;
            }
        }
    </style>
</head>

    <div class="controls">
        <button onclick="toggleFloat()" id="btn-float">Float: ON</button>
        <button onclick="toggleFlicker()" id="btn-flicker">Flicker: ON</button>
        <button onclick="toggleColor()" id="btn-color">Magenta</button>
    </div>

    <div class="info">prototype-neon-sign-v3.html | SVG professionnel "Site en construction..."</div>

    <script>
        let floatOn = true;
        let flickerOn = true;
        let isMagenta = true;

        function toggleFloat() {
            floatOn = !floatOn;
            document.querySelector('.neon-sign-wrapper').style.animation =
                floatOn ? 'neon-float 6s ease-in-out infinite' : 'none';
            document.getElementById('btn-float').textContent = `Float: ${floatOn ? 'ON' : 'OFF'}`;
            document.getElementById('btn-float').classList.toggle('active', !floatOn);
        }

        function toggleFlicker() {
            flickerOn = !flickerOn;
            document.querySelectorAll('.flicker-a, .flicker-b, .flicker-c').forEach(el => {
                el.style.animation = flickerOn ? '' : 'none';
            });
            document.getElementById('btn-flicker').textContent = `Flicker: ${flickerOn ? 'ON' : 'OFF'}`;
            document.getElementById('btn-flicker').classList.toggle('active', !flickerOn);
        }

        function toggleColor() {
            isMagenta = !isMagenta;
            document.documentElement.style.setProperty('--neon-color', isMagenta ? '#ff0080' : '#00ffff');
            document.getElementById('btn-color').textContent = isMagenta ? 'Magenta' : 'Cyan';
        }
    </script>
</body>
</html>
